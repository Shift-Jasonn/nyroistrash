<!DOCTYPE html>

<body>

    <p>This is a simple HTML page served by Express.</p>

    <nav id="status"></nav>

    <div id="login-section" hidden>

        <form id="login-form" action="/login" method="post">

            <label><input type="checkbox" name="rememberMe" /> Remember me</label>
            <button type="submit">Log in</button>
        </form>
        <p id="login-message" role="status"></p>
    </div>

    <div id="home-content" hidden>
        <img src="https://media0.giphy.com/media/Lo5aWVXl6M38iV3YhK/200.webp" alt="Yeat">

        <nav>
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/guestbook">Guestbook</a>
            <a href="/space">Space</a>
        </nav>
    </div>

    <button id="logout-button" type="button" hidden>Log out</button>

    <script src="/js/chapa.js"></script>
</body>

</html>
