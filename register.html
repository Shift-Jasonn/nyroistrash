<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Jason's Station</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <nav id="status">
        <h1>Create an account</h1>
    </nav>

    <main>
        <form id="register-form">

            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="20"
                required>

            <label for="password">Password (8 to 72 characters)</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8"
                maxlength="72" required>

            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72"
                required>

            <button type="submit">Create account</button>

        </form>

        <p id="register-message" role="alert"></p>

        <p>Already have an account? <a href="/">Log in</a></p>
    </main>

    <script src="/js/register.js"></script>
</body>

</html>
